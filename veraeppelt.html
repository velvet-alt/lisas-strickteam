<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Veräppelt</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    .troll-gif {
      width: 300px;
      height: auto;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 4rem;
      margin-bottom: 30px;
    }

    .back-btn {
      display: inline-block;
      padding: 12px 24px;
      background-color: #333;
      color: white;
      text-decoration: none;
      border-radius: 999px;
      font-weight: bold;
      transition: 0.3s;
    }

    .back-btn:hover {
      background-color: #555;
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <img src="Bilder/troll.gif" alt="Troll" class="troll-gif">

  <h1>Bestellungen sind erst wieder ab 2030 möglich!</h1>

  <a href="index.html" class="back-btn">
    Zurück zur Startseite
  </a>

</body>
</html>
